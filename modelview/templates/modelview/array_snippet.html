{% load modelview_extras %}
<script>
var counter_{{ field.name }} = 1;
function addInput_{{ field.name }}(val){
    var newdiv = document.createElement('div');
    newdiv.id = "div_{{ field.name }}_" + counter_{{ field.name }};
    newdiv.className="input-group factsheet-array__entry";
    newdiv.innerHTML = "<input class='form-control' type='text' id=id_{{ field.name }}_" + counter_{{ field.name }} + " name={{ field.name }}_" + counter_{{ field.name }} + " aria-labelledby='{{ field.name }}_label'><button type='button' class='btn btn-secondary' aria-label='Remove this entry' onclick='delInput_{{ field.name }}("+ counter_{{ field.name }} + ")'><span class='fas fa-times' aria-hidden='true'></span></button>";
    // As a property, never in the markup: an entry may hold a quote.
    newdiv.querySelector("input").value = val;
    document.getElementById("{{ field.name }}_container").appendChild(newdiv,0);
    counter_{{ field.name }}++;
}
function delInput_{{ field.name }}(c){
    var parent = document.getElementById("{{ field.name }}_container");
    var child = document.getElementById("div_{{ field.name }}_"+c);
    parent.removeChild(child);
}
</script>
<div role="group" aria-labelledby="{{ field.name }}_label">
  <div id="{{ field.name }}_container">
    <script>
    {% for entry in field|splitarray %}
            addInput_{{ field.name }}("{{ entry|escapejs }}")
    {% endfor %}
    </script>
  </div>
  <button type="button"
          class="btn btn-secondary btn-sm"
          aria-label="Add an entry"
          onclick="addInput_{{ field.name }}('')">
    <span class="fas fa-plus" aria-hidden="true"></span>
  </button>
</div>
