{% load django_bootstrap5 %}
<section class="profile-category htmxFormComponent">
  {% if organization %}
    <h2 class="header">Edit {{ organization }}</h2>
  {% else %}
    <h2 class="header">Create Group</h2>
  {% endif %}
  <h2 class="profile-category__heading profile-category__heading--border-btm">
    Details
  </h2>
  {% if organization %}
    <form id="organization-form"
          hx-post="{% url 'login:organization-edit' organization_id=organization.id %}"
          hx-target=".htmxFormComponent">
      {% csrf_token %}
      {% bootstrap_form form %}
    </form>
  {% else %}
    <form id="organization-form"
          hx-post="{% url 'login:organization-create' %}"
          hx-trigger="submit"
          hx-target=".htmxFormComponent">
      {% csrf_token %}
      {% bootstrap_form form %}
    </form>
  {% endif %}
  <div class="profile-category__btns">
    <button form="organization-form"
            type="submit"
            value="Submit"
            class="profile-category__btn  profile-category__btn--save">
      Save
    </button>
  </div>
</section>
