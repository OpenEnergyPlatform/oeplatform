          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
          description: ''
    patch:
      operationId: scenario_bundles_scenarios_partial_update
      description: '`GET` reads one. `PATCH` changes the keys it names. `DELETE` removes
        it.'
      parameters:
      - in: path
        name: pid
        schema:
          type: string
        required: true
      - in: path
        name: uid
        schema:
          type: string
        required: true
      tags:
      - scenario-bundles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedScenario'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedScenario'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedScenario'
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
          description: ''
    delete:
      operationId: scenario_bundles_scenarios_destroy
      description: |-
        Remove this part, and with it what only it holds.

        The same order as a patch -- bundle, part, caller, precondition -- and
        the same write path, because a delete is a write like any other: it is
        validated against the shape, guarded on the bundle's version and
        recorded in the history. What differs is the arithmetic in front of it,
        which is `oekg.removal`'s.

        No retyped confirmation token, unlike the whole-bundle delete. Ceremony
        is proportional to blast radius: this removes one bounded part that can
        be created again, and the history says what it held.
      parameters:
      - in: path
        name: pid
        schema:
          type: string
        required: true
      - in: path
        name: uid
        schema:
          type: string
        required: true
      tags:
      - scenario-bundles
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: Removed. The body names what was deleted and what was only
            unlinked, which no status code can say.
