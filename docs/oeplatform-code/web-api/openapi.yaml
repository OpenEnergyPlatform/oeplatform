        own has-uuid, which the server mints, so it is not a field here.

        What the shape requires of one, and therefore what is required here: a
        label, at least one author, and exactly one publication date. The doi and
        the reference are optional, and the reference is singular because the shape
        allows at most one.
      properties:
        label:
          type: string
        doi:
          type: string
          nullable: true
        publication_date:
          type: string
          format: date-time
        authors:
          type: array
          items:
            $ref: '#/components/schemas/NodeReference'
        reference:
          type: string
          format: uri
          nullable: true
    RefEnum:
      enum:
      - table
      - dataset
      type: string
      description: |-
        * `table` - table
        * `dataset` - dataset
    Scenario:
      type: object
      description: |-
        One scenario factsheet -- a sub-resource, not a field of its bundle.

        What makes it one is the shape: it carries its own has-uuid. That uuid is
        **not** a field here, because the server mints it; a client supplies no
        identifier anywhere in this API.
      properties:
        label:
          type: string
        acronym:
          type: string
        abstract:
          type: string
          nullable: true
        study_regions:
          type: array
          items:
            $ref: '#/components/schemas/NodeReference'
        interacting_regions:
          type: array
          items:
            $ref: '#/components/schemas/NodeReference'
        years:
          type: array
          items:
            type: string
            format: date-time
        scenario_types:
          type: array
          items:
            type: string
      required:
      - acronym
      - label
    ScenarioBundleCreate:
      type: object
      description: |-
        The bundle field set **plus** its nested sub-resources, for `POST` only.

        The asymmetry is the whole point and it is structural rather than a flag: a
        bundle `POST` builds its scenarios and study reports with it, and a bundle
        `PATCH` uses the class above, which has no such key and therefore refuses
        one. That is what lets a pipeline create a whole bundle in one call without
        giving any call the power to drop its parts by omitting them.

        Dataset links are deliberately **not** here. They hang off a scenario
        rather than off the bundle, and they are add-and-remove only, so there is
        no partial update of one to reason about -- nesting them would make a
        create the one place their fields could be written together.
      properties:
        label:
          type: string
        acronym:
          type: string
        abstract:
          type: string
          nullable: true
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/NodeReference'
        organisations:
          type: array
          items:
            $ref: '#/components/schemas/NodeReference'
        funders:
          type: array
          items:
            $ref: '#/components/schemas/NodeReference'
        frameworks:
          type: array
          items:
            $ref: '#/components/schemas/Part'
        models:
          type: array
          items:
            $ref: '#/components/schemas/Part'
        scenarios:
          type: array
          items:
            $ref: '#/components/schemas/Scenario'
        study_reports:
          type: array
          items:
            $ref: '#/components/schemas/StudyReport'
        descriptors:
          type: array
          items:
            type: string
        sector_divisions:
          type: array
          items:
            type: string
        sectors:
          type: array
          items:
            type: string
        technologies:
          type: array
          items:
            type: string
        energy_carriers:
          type: array
          items:
            type: string
      required:
      - acronym
      - label
    ScenarioDataTables:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 1000
        human_readable_name:
          type: string
          nullable: true
          maxLength: 1000
        url:
          type: string
          readOnly: true
      required:
      - id
      - name
      - url
    StudyReport:
      type: object
      description: |-
        One study report -- the publication a bundle is written up in.

        A sub-resource for the same reason a scenario is: the shape gives it its
        own has-uuid, which the server mints, so it is not a field here.

        What the shape requires of one, and therefore what is required here: a
        label, at least one author, and exactly one publication date. The doi and
        the reference are optional, and the reference is singular because the shape
        allows at most one.
      properties:
        label:
          type: string
        doi:
          type: string
          nullable: true
        publication_date:
          type: string
          format: date-time
        authors:
          type: array
          items:
            $ref: '#/components/schemas/NodeReference'
        reference:
          type: string
          format: uri
          nullable: true
      required:
      - authors
      - label
      - publication_date
    TypeEnum:
      enum:
      - input
      - output
      type: string
      description: |-
        * `input` - input
        * `output` - output
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
