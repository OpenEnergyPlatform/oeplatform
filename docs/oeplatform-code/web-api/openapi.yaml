  /api/v0/scenario-bundles/{uid}/scenarios/{pid}/:
    get:
      operationId: scenario_bundles_scenarios_retrieve_2
      description: '`GET` reads one. `PATCH` changes the keys it names. `DELETE` removes
        it.'
      parameters:
      - in: path
        name: pid
        schema:
          type: string
        required: true
      - in: path
        name: uid
        schema:
          type: string
        required: true
