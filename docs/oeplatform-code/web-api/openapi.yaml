          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Refused, and **nothing was written**. The payload named a key
            the closed bundle shape does not have, or a value the shape's own `sh:in`
            list does not allow, or the change would introduce a violation of the
            OEKG shape -- `violations` then names them, and `pre_existing_violations`
