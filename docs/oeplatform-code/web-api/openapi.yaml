    get:
      operationId: scenario_bundles_scenarios_datasets_retrieve_2
      description: |-
        `GET` reads one dataset link, `DELETE` removes it. No `PATCH`.

        Add and remove is the whole contract, so the remove is the other half of
        the design rather than an extra: with no way to edit a link, a client that
        got one wrong has nothing else to reach for.
      parameters:
      - in: path
        name: did
        schema:
          type: string
        required: true
      - in: path
        name: sid
        schema:
          type: string
        required: true
      - in: path
        name: uid
        schema:
          type: string
        required: true
      tags:
      - scenario-bundles
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          description: No response body
    delete:
      operationId: scenario_bundles_scenarios_datasets_destroy
      description: |-
        Remove one link. Its target is not touched and never was.

        A link is the only removable thing in this API with no children and
        nothing shared beneath it -- what it points at is an OEP table or
        dataset, which lives in Postgres and which no graph write may reach. It
        still goes through the typed walk, because the guard clause is what
        decides whether *this* node is only claimed by this scenario, and that
        is not a question the class alone answers.
      parameters:
      - in: path
        name: did
        schema:
          type: string
        required: true
      - in: path
        name: sid
        schema:
          type: string
        required: true
      - in: path
        name: uid
        schema:
          type: string
        required: true
      tags:
      - scenario-bundles
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: Removed. The body names what was deleted and what was only
            unlinked, which no status code can say.
