          items:
            type: string
        sector_divisions:
          type: array
          items:
            type: string
        sectors:
          type: array
          items:
            type: string
        technologies:
          type: array
          items:
            type: string
        energy_carriers:
          type: array
          items:
            type: string
      required:
      - acronym
      - label
