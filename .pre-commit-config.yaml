exclude: ^.*(.min.js|.min.css|.js.map|js|mkdocs.yml|/dist/.*)$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.1
    hooks:
      - id: black
  # isort is a local hook so that pre-commit.ci's autoupdate cannot move it:
  # isort 10 needs Python >= 3.11, and the platform stays on 3.10 until the
  # server move, so a newer rev cannot be installed from the project's venv.
  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: isort
        language: python
        additional_dependencies: ["isort==9.0.2"]
        types_or: [cython, pyi, python]
        require_serial: true
        args: ["--profile", "black", "--filter-files"]
  - repo: https://github.com/pycqa/flake8
    rev: 7.5.0
    hooks:
      - id: flake8
        args: ["--max-line-length=88", "--ignore=E20,W503"] # black compatible
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.14.0
    hooks:
      - id: eslint
        additional_dependencies:
          - eslint@9.25
          - eslint-config-google@0.14.0
          - eslint-plugin-jsdoc@39.2.9
          - eslint-plugin-react@7.37.3
          - eslint-plugin-react-hooks@5.1.0
          - eslint-plugin-prettier@5.1.3
        args: ["--fix"]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: .*\.(json|md|yaml|yml)$
        # The OpenAPI description is written by `manage.py spectacular` and is
        # checked against a fresh generation by the test suite. Reformatting it
        # here would make the committed copy something the generator never
        # produces, and the guard would then be red on every branch.
        exclude: ^docs/oeplatform-code/web-api/openapi\.yaml$
  - repo: https://github.com/djlint/djLint
    # see https://djlint.com/docs/integrations/
    rev: v1.49.2
    hooks:
      - id: djlint-reformat-django
        files: .*templates/.*\.html$
