<VirtualHost *:80>

    Alias /static /app/static
    <Directory /app/static>
        Require all granted
    </Directory>

    <Directory /app/oeplatform>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    WSGIApplicationGroup %{GLOBAL}

    # --- process count -----------------------------------------------------
    # Every mod_wsgi process carries its own SQLAlchemy connection pool. The
    # pool's ceiling is per process; the database's is per cluster. So this
    # must hold:
    #
    #     total processes x (OEDB_POOL_SIZE + OEDB_MAX_OVERFLOW) < usable slots
    #
    # The two constants are in oedb/connection.py; "usable slots" is
    # max_connections minus superuser_reserved_connections on the OEDB.
    # Today: (4 + 1) x (2 + 15) = 85, against 247 on the production database.
    #
    # api/tests/test_podman_apache_config.py asserts exactly that, so raising a
    # process count here fails the suite until the pool is re-sized with it.
    # Deliberate: production hit its connection ceiling in September 2026
    # because a process count was raised 4 -> 12 in a config no repository
    # could see, and nothing recomputed the pool.
    #
    # Left at 4 rather than matched to production's 12 -- that host has 32
    # cores and its thirteen daemons hold ~34 GiB resident. Size this against
    # the host this stack runs on, and re-check the line above when you do.
    #
    # Timeouts match production. No request-timeout: it restarts the daemon
    # mid-request and Bulk Upload is legitimately long (ADR 0002).
    WSGIDaemonProcess oeplatform python-path=/app \
        processes=4 threads=15 \
        socket-timeout=300 listen-backlog=200 graceful-timeout=15

    # --- the stateful API needs exactly one process ------------------------
    # api/sessions.py keeps live OEDB connections in a module-global dict keyed
    # by a connection_id handed back to the client. mod_wsgi has no session
    # affinity, so above one process a client that opens a connection and then
    # uses it lands on a different interpreter, misses the dict and silently
    # gets a new connection -- or "Cursor not found". MUST stay processes=1
    # until that state is shared.
    WSGIDaemonProcess oeplatform_api python-path=/app \
        processes=1 threads=15 \
        socket-timeout=300

    WSGIProcessGroup oeplatform
    WSGIScriptAlias / /app/oeplatform/wsgi.py

    <Location /api/v0/advanced>
        WSGIProcessGroup oeplatform_api
    </Location>

    WSGIPassAuthorization On

    # Security headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

</VirtualHost>

ErrorLog /dev/stderr
TransferLog /dev/stdout
