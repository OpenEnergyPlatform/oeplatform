# nginx reverse proxy for the OEPlatform Podman stack.
#
# The public endpoint is an upstream Apache reverse proxy that terminates the
# public TLS and handles authentication, then RE-ENCRYPTS to this host: it opens
# an HTTPS connection to nginx here on :443. So nginx must terminate TLS as well
# and then proxies plain HTTP to the rootless container on 127.0.0.1:8080.
# nginx runs as root, so binding privileged :443 is fine even though the app
# container is rootless.
#
# The certificate may be self-signed — Apache's mod_proxy does not verify the
# backend certificate by default (SSLProxyVerify none). install-nginx.sh
# generates a self-signed cert automatically if none exists; drop a real cert at
# the same paths to replace it.
#
# Install:  bash podman/nginx/install-nginx.sh   (see podman/quadlets/README.md)

# Preserve the scheme the client used (the upstream sets X-Forwarded-Proto);
# fall back to this hop's scheme (https) only if the header is absent.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name openenergyplatform.example.org;        # <-- set by install-nginx.sh (OEP_URL)

    # TLS termination. Self-signed by default (see install-nginx.sh); replace
    # with a real cert at the same paths if your upstream verifies backends.
    ssl_certificate     /etc/nginx/ssl/oeplatform/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/oeplatform/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # OEP is a data platform — allow large table/media uploads.
    # Set a concrete ceiling (e.g. 2g) or 0 to disable the limit entirely.
    client_max_body_size 2g;

    location / {
        # The rootless oeplatform container, published on 127.0.0.1:8080.
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;   # Django reads this (OEP_BEHIND_TLS_PROXY)
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
