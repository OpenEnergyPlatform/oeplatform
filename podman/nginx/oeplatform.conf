# nginx reverse proxy for the OEPlatform Podman stack.
#
# TLS is terminated UPSTREAM (an institutional reverse proxy / load balancer in
# front of this host handles public HTTPS). It then forwards already-decrypted,
# plain HTTP to this host on port 443 (the only port open to the LB), and this
# nginx proxies it to the rootless Podman container published on 127.0.0.1:8080.
#
# So port 443 here carries cleartext HTTP, not TLS — there is no `ssl` directive
# and no certificate; those live on the upstream proxy.
#
# Install on the server:
#   sudo apt install nginx
#   sudo cp podman/nginx/oeplatform.conf /etc/nginx/sites-available/oeplatform
#   sudo ln -s /etc/nginx/sites-available/oeplatform /etc/nginx/sites-enabled/oeplatform
#   sudo rm -f /etc/nginx/sites-enabled/default        # drop the default site
#   sudo nginx -t && sudo systemctl reload nginx

# Preserve the original scheme the client used. The upstream proxy sets
# X-Forwarded-Proto=https; only fall back to this hop's scheme if it is absent.
# (Setting it unconditionally to $scheme would clobber it to "http" and make
# Django treat the request as insecure.)
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    # Port the upstream proxy forwards decrypted HTTP to. NOTE: this is plain
    # HTTP even though it is port 443 — TLS is terminated by the upstream LB,
    # which forwards cleartext HTTP here (there is intentionally no `ssl` and no
    # certificate). nginx runs as root, so binding privileged :443 is fine even
    # though the app container is rootless. Change the port if your upstream
    # targets a different one.
    listen      443;
    listen      [::]:443;
    server_name openenergyplatform.example.org;        # <-- change to your domain

    # OEP is a data platform — allow large table/media uploads.
    # Set a concrete ceiling (e.g. 2g) or 0 to disable the limit entirely.
    client_max_body_size 2g;

    location / {
        # Must match the host-published port of the oeplatform container
        # (PublishPort 127.0.0.1:8080:80).
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;  # Django reads this (OEP_BEHIND_TLS_PROXY)
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
