# nginx reverse proxy for the OEPlatform Podman stack.
#
# nginx runs on the HOST (a normal system service running as root, so binding
# port 443 is fine) and terminates TLS. It proxies plain HTTP to the rootless
# Podman container published on 127.0.0.1:8080. This sidesteps the rootless
# "privileged port < 1024" restriction entirely — the container never touches
# 443.
#
# Certificates are provided by YOU (no certbot). Drop your certificate chain and
# private key at the ssl_certificate / ssl_certificate_key paths below.
#
# Install on the server:
#   sudo apt install nginx
#   sudo cp podman/nginx/oeplatform.conf /etc/nginx/sites-available/oeplatform
#   sudo ln -s /etc/nginx/sites-available/oeplatform /etc/nginx/sites-enabled/oeplatform
#   sudo rm -f /etc/nginx/sites-enabled/default        # drop the default site
#   sudo nginx -t && sudo systemctl reload nginx

# ── Redirect all plain HTTP to HTTPS ─────────────────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name openenergyplatform.example.org;        # <-- change to your domain

    return 301 https://$host$request_uri;
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name openenergyplatform.example.org;        # <-- change to your domain

    # TLS certificate — provide your own (no certbot).
    # For a quick self-signed cert to test the setup:
    #   sudo mkdir -p /etc/nginx/ssl/oeplatform
    #   sudo openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
    #     -keyout /etc/nginx/ssl/oeplatform/privkey.pem \
    #     -out    /etc/nginx/ssl/oeplatform/fullchain.pem \
    #     -subj "/CN=openenergyplatform.example.org"
    ssl_certificate     /etc/nginx/ssl/oeplatform/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/oeplatform/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    # OEP is a data platform — allow large table/media uploads.
    # Set a concrete ceiling (e.g. 2g) or 0 to disable the limit entirely.
    client_max_body_size 2g;

    # HSTS — only enable once you are certain HTTPS works and will stay on.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        # Must match the host-published port of the oeplatform container
        # (PublishPort / ports: 127.0.0.1:8080:80).
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # Django reads this (OEP_BEHIND_TLS_PROXY)
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
