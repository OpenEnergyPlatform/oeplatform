receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://localhost:*"
            - "http://127.0.0.1:*"

processors:
  batch:

exporters:
  debug:
    verbosity: detailed
  # Exposes a Prometheus scrape target
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "oep"
  # Exports traces to Jaeger over OTLP gRPC
  otlp/jaeger:
    endpoint: "jaeger:4317"
    tls:
      insecure: true


service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, prometheus]
