{# use: A status beside its subject (Published, Draft, Early Access, what the viewer may do), or a neutral count; never a tag and never a pill. #}
<p class="d-flex flex-wrap gap-2 align-items-center mb-0">
  <span class="badge badge--success">Published</span>
  <span class="badge badge--warning">Draft</span>
  <span class="badge badge--info">Early Access</span>
  <span class="badge badge--danger">Embargoed</span>
  <span class="badge badge--neutral">12</span>
</p>
